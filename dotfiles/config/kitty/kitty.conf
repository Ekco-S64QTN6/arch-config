# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family='Maple Mono NF' postscript_name=MapleMono-NF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Switched from the plain 'Maple Mono' (maplemono-ttf) to the NF build
# (maplemono-nf) on 2026-09-08, for two reasons:
#   1. NF is the AutoHint build. Both displays are 1920x1080 at 598mm/531mm
#      (~82 and ~92 DPI) and font_size is 8.5 -- upstream recommends hinted
#      for <=1080p and unhinted only for HiDPI. We had it backwards.
#   2. Nerd Font glyphs are now IN the text font, so prompt icons no longer
#      come from AtkynsonMono/MesloLGS via fontconfig fallback, where baseline
#      and advance width do not necessarily match the text.
# maplemono-ttf is still installed -- revert by changing the two names above
# back to 'Maple Mono' / MapleMono-Regular.

# OpenType character variants. These are OFF by default, which is why the
# terminal did not look like the upstream showcase. Keyed on PostScript name,
# per face. Full list of what each tag does is in the audit report.
#   cv01  normalize special symbols  @ $ & % Q
#   cv04  alternative l with left bottom bar (Consolas-like) -- easier l/1/I
#   zero  slashed zero
# Add or remove tags freely, or use: kitty +kitten choose-fonts
font_features MapleMono-NF-Regular        +cv01 +cv04 +zero
font_features MapleMono-NF-SemiBold       +cv01 +cv04 +zero
font_features MapleMono-NF-Italic         +cv01 +cv04 +zero
font_features MapleMono-NF-SemiBoldItalic +cv01 +cv04 +zero

#: Fonts {{{

font_size 8.5

#

background #252525
foreground #EFEFEF
cursor #C9C973
cursor_text_color #000000

# this gives you just enough space to see active window boarder
# if you're running split views
window_margin_width 1 1 0 0
active_border_color #00DEFF
inactive_border_color #007587
scrollback_lines 5000
background_opacity 0.9
#: black
color0 #000000
color8 #525252
#: red
color1 #FD788B
color9 #FDB0BA
#: green
color2 #20FF4F
color10 #25BA58
#: yellow
color3 #F4CC67
color11 #FFCA14
#: blue
color4 #68A9FF
color12 #8CDAFF
#: magenta
color5 #F970CD
color13 #FE97E1
#: cyan
color6 #39FFE2
color14 #A5FFFA
#: white
color7 #ffffff
color15 #d4ccb9
color100 #1A5225
linux_display_server auto

# without this kittyTerm on mac looks terrible washed out
#macos_colorspace displayp3
#map kitty_mod+t new_tab_with_cwd
#map kitty_mod+enter new_window_with_cwd

# note: for some reason kitty doesn't clear the scroll back buffer on clear
# so this is a little work around
map cmd+k send_text terminal,application \x63\x6C\x65\x61\x72\x0A
tab_bar_align center
sync_to_monitor no
input_delay 0
repaint_delay 2
# --- Terminal Bell (Muted) ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no
command_on_bell none
# Forces the visual bell to be invisible by matching your background
visual_bell_color none
# Extra safety: some shells ignore kitty settings and use their own
bell_path none
#remote control
allow_remote_control yes
listen_on unix:/tmp/mykitty
