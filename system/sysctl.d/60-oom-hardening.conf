# Desktop policy: let the OOM killer reclaim memory instead of panicking.
#
# This file previously set vm.panic_on_oom=1, which turns any out-of-memory
# condition into a full kernel panic, and kernel.panic=10, which then force
# rebooted 10 seconds later. On a workstation running llama-server, ML venvs
# and Proton games against 30 GiB of RAM, an OOM is a routine and survivable
# event -- panicking on it means losing unsaved work and an unclean unmount.
# panic_on_oom is intended for headless HA cluster nodes, not desktops.
vm.panic_on_oom = 0

# kernel.panic is left at the kernel default (0 = halt and leave the panic
# message on screen) so a real panic can actually be read and diagnosed.
